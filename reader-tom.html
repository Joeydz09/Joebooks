<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قراءة توم ولندن المظلمة | مكتبة الأحلام</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1528;color:#edf2fa}header{background:#14233c;border-bottom:1px solid #50617c;padding:16px max(16px,calc((100vw - 1100px)/2))}h1{font-size:clamp(18px,3vw,25px);margin:8px 0}a{color:#e4edfb;text-decoration:none}.small{font-size:13px;color:#c5d1e3}.bar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;background:#101e33;padding:12px;position:sticky;top:0;z-index:5}button,.action{font:inherit;background:#243957;color:#fff;border:1px solid #7c90b1;border-radius:9px;padding:10px 12px;cursor:pointer}button:disabled{opacity:.4;cursor:default}input{width:68px;padding:10px;border-radius:8px;border:0;text-align:center;font:inherit}main{max-width:1100px;margin:0 auto;padding:14px;text-align:center}#stage{display:flex;justify-content:center;align-items:flex-start;min-height:60vh;overflow:auto;border:1px solid #50617c;border-radius:12px;background:#25334a;padding:12px}canvas{display:block;max-width:none;box-shadow:0 5px 20px #0006;background:white}#status{font-size:14px;color:#c6d4e9;margin:12px}body.light{background:#e8edf5;color:#14233c}body.light .bar{background:#dce4f0}body.light #stage{background:#cbd5e3}body.light #status{color:#344b69}@media(max-width:600px){header{padding:12px}.bar{gap:6px}button,.action{padding:9px 10px}main{padding:7px}#stage{padding:5px}}
</style></head><body><header><a class="small" href="./index.html">← العودة إلى مكتبة الأحلام</a><h1>📖 توم و لندن المظلمة</h1><div class="small">محمد البدوي · 79 صفحة</div></header>
<nav class="bar" aria-label="أدوات القراءة"><button id="prev">السابق</button><label for="page">صفحة</label><input id="page" type="number" min="1" max="79" value="1" inputmode="numeric"><span id="total">من 79</span><button id="next">التالي</button><button id="minus" aria-label="تصغير">−</button><button id="plus" aria-label="تكبير">+</button><button id="theme">☀️ وضع فاتح</button><a class="action" href="https://t.me/quotes_90/3160" target="_blank" rel="noopener noreferrer">⬇️ تحميل عبر تيليجرام</a></nav>
<main><p id="status" role="status">جاري تحميل القارئ…</p><div id="stage"><canvas id="canvas" aria-label="صفحة الرواية"></canvas></div><p class="small">إذا تعذّر عرض الكتاب، <a href="./%D8%AA%D9%88%D9%85%20%D9%88%20%D9%84%D9%86%D8%AF%D9%86%20%D8%A7%D9%84%D9%85%D8%B8%D9%84%D9%85%D8%A9%20.pdf" target="_blank" rel="noopener noreferrer"><u>افتح ملف PDF مباشرة</u></a>.</p></main>
<script type="module">
const status=document.getElementById("status"),canvas=document.getElementById("canvas"),stage=document.getElementById("stage"),input=document.getElementById("page"),total=document.getElementById("total"),prev=document.getElementById("prev"),next=document.getElementById("next");
const key="maktabat-reader-2019-page";let pdf=null,page=1,zoom=1,renderJob=null,sequence=0;
try{const saved=Number(localStorage.getItem(key));if(Number.isInteger(saved)&&saved>0)page=saved}catch(e){}
function save(){try{localStorage.setItem(key,String(page))}catch(e){}}
async function render(){if(!pdf)return;const current=++sequence;if(renderJob){try{renderJob.cancel()}catch(e){}}status.textContent="جاري عرض الصفحة "+page+"…";input.value=page;total.textContent="من "+pdf.numPages;prev.disabled=page<=1;next.disabled=page>=pdf.numPages;save();
try{const p=await pdf.getPage(page);if(current!==sequence)return;const base=p.getViewport({scale:1});const fit=Math.min(1.8,Math.max(.35,(stage.clientWidth-24)/base.width));const scale=fit*zoom;const viewport=p.getViewport({scale});const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(viewport.width*dpr);canvas.height=Math.floor(viewport.height*dpr);canvas.style.width=viewport.width+"px";canvas.style.height=viewport.height+"px";const ctx=canvas.getContext("2d");renderJob=p.render({canvasContext:ctx,viewport,transform:[dpr,0,0,dpr,0,0]});await renderJob.promise;if(current===sequence)status.textContent="الصفحة "+page+" من "+pdf.numPages;}
catch(e){if(e?.name!=="RenderingCancelledException"&&current===sequence)status.textContent="تعذّر عرض الصفحة. جرّب فتح ملف PDF مباشرة."}}
function go(n){if(!pdf)return;page=Math.min(pdf.numPages,Math.max(1,Number(n)||1));render()}
prev.onclick=()=>go(page-1);next.onclick=()=>go(page+1);input.onchange=()=>go(input.value);document.getElementById("plus").onclick=()=>{zoom=Math.min(3,zoom+.2);render()};document.getElementById("minus").onclick=()=>{zoom=Math.max(.5,zoom-.2);render()};document.getElementById("theme").onclick=function(){document.body.classList.toggle("light");this.textContent=document.body.classList.contains("light")?"🌙 وضع ليلي":"☀️ وضع فاتح"};
let resizeTimer;window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,180)});
try{const pdfjs=await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs");pdfjs.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";pdf=await pdfjs.getDocument({url:"./%D8%AA%D9%88%D9%85%20%D9%88%20%D9%84%D9%86%D8%AF%D9%86%20%D8%A7%D9%84%D9%85%D8%B8%D9%84%D9%85%D8%A9%20.pdf"}).promise;input.max=pdf.numPages;page=Math.min(page,pdf.numPages);await render()}catch(e){status.textContent="تعذّر تشغيل قارئ PDF. تأكد من الاتصال بالإنترنت أو افتح الملف مباشرة."}
</script></body></html>
