<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1426">
  <title>تفاصيل الكتاب | مكتبة الأحلام</title>
  <style>
    :root {
      --navy: #0b1426;
      --silver: #dce4ef;
      --muted: #aab8cc;
      --panel: #121f35;
      --line: rgba(220,228,239,.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: var(--navy);
      color: var(--silver);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.9;
    }
    main { max-width: 850px; margin: auto; }
    .back {
      display: inline-block;
      margin-bottom: 22px;
      color: var(--silver);
      text-decoration: none;
    }
    .book {
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .cover {
      display: block;
      width: min(220px, 80%);
      max-height: 330px;
      object-fit: contain;
      margin: 0 auto 22px;
      border-radius: 10px;
    }
    h1 { line-height: 1.5; margin: 8px 0; }
    .meta { color: var(--muted); margin: 5px 0; }
    .synopsis {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-top: 24px;
    }
    .actions { margin-top: 28px; }
    .button {
      display: inline-block;
      padding: 10px 18px;
      margin: 5px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--silver);
      text-decoration: none;
    }
    .primary { background: #243957; }
    .status { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <a class="back" href="./index.html">← العودة إلى مكتبة الأحلام</a>
    <article class="book" id="book">
      <p class="status" id="status">جارٍ تحميل تفاصيل الكتاب...</p>
    </article>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const container = document.getElementById("book");
    const status = document.getElementById("status");

    function addText(parent, tag, className, value) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = value || "";
      parent.appendChild(element);
      return element;
    }

    function safeLocalCover(value) {
      if (typeof value !== "string") return "";
      if (/^(https?:\/\/)/i.test(value)) return value;
      if (value.startsWith("./covers/")) return value;
      return "";
    }

    async function loadBook() {
      if (!id) throw new Error("لم يتم تحديد معرّف الكتاب.");

      const response = await fetch("./books.json", { cache: "no-store" });
      if (!response.ok) throw new Error("تعذّر تحميل بيانات المكتبة.");

      const data = await response.json();
      const books = Array.isArray(data) ? data : data.books;
      if (!Array.isArray(books)) throw new Error("تنسيق بيانات الكتب غير متوقع.");

      const book = books.find(item => item && String(item.id) === id);
      if (!book) throw new Error("لم نعثر على هذا الكتاب.");

      container.replaceChildren();

      const cover = safeLocalCover(book.cover);
      if (cover) {
        const image = document.createElement("img");
        image.className = "cover";
        image.src = cover;
        image.alt = "غلاف " + (book.title || "الكتاب");
        image.onerror = () => image.remove();
        container.appendChild(image);
      }

      addText(container, "h1", "", book.title || "كتاب بلا عنوان");
      addText(container, "p", "meta", "المؤلف: " + (book.author || "غير محدد"));
      addText(container, "p", "meta", "التصنيف: " + (book.category || "غير محدد"));
      if (book.pages) addText(container, "p", "meta", "عدد الصفحات: " + book.pages);

      addText(container, "h2", "", "نبذة عن الكتاب");
      addText(container, "div", "synopsis", book.synopsis || "لا تتوفر نبذة لهذا الكتاب حاليًا.");

      const actions = document.createElement("div");
      actions.className = "actions";

      if (typeof book.url === "string" && /^https:\/\/t\.me\//i.test(book.url)) {
        const link = document.createElement("a");
        link.className = "button primary";
        link.href = book.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "📖 فتح الكتاب في تيليجرام";
        actions.appendChild(link);
      }

      const back = document.createElement("a");
      back.className = "button";
      back.href = "./index.html";
      back.textContent = "العودة إلى المكتبة";
      actions.appendChild(back);
      container.appendChild(actions);

      document.title = (book.title || "تفاصيل الكتاب") + " | مكتبة الأحلام";
    }

    loadBook().catch(error => {
      container.replaceChildren();
      addText(container, "p", "status", error.message || "حدث خطأ أثناء تحميل الكتاب.");
      const back = document.createElement("a");
      back.className = "button";
      back.href = "./index.html";
      back.textContent = "العودة إلى المكتبة";
      container.appendChild(back);
    });
  </script>
</body>
</html>
