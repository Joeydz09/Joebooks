<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1426">
  <title>مكتبة الأحلام</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#0b1426; --silver:#dce4ef; --muted:#a8b6c9; --gold:#d6b77a; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100svh; display:grid; place-items:center; padding:24px;
      color:#f8faff; font-family:Tahoma,Arial,sans-serif;
      background:radial-gradient(ellipse at 50% 20%,rgba(108,137,181,.2),transparent 48%),var(--navy);
    }
    .welcome {
      width:min(100%,440px); min-height:min(690px,calc(100svh - 48px));
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:38px 25px; border:1px solid rgba(220,228,239,.16);
      border-radius:28px; background:linear-gradient(155deg,rgba(25,42,68,.82),rgba(9,19,34,.94));
      box-shadow:0 24px 70px rgba(0,0,0,.34); position:relative; overflow:hidden;
    }
    .welcome:before,.welcome:after { content:""; position:absolute; width:190px;height:190px;border:1px solid rgba(220,228,239,.07);border-radius:50%;pointer-events:none; }
    .welcome:before { top:-120px;right:-95px; } .welcome:after { bottom:-130px;left:-95px; }
    .logo-wrap {
      width:116px;height:116px;border-radius:28px;padding:5px;margin-bottom:27px;
      border:1px solid rgba(220,228,239,.48);background:linear-gradient(145deg,#293d5b,#111d31);
      box-shadow:0 12px 35px rgba(0,0,0,.3),0 0 28px rgba(220,228,239,.08);
      display:grid;place-items:center;
    }
    .logo-wrap img { width:100%;height:100%;object-fit:cover;border-radius:22px; }
    h1 { margin:0;color:var(--silver);font-family:Amiri,serif;font-size:clamp(34px,9vw,43px);line-height:1.45; }
    .subtitle { margin:2px 0 22px;color:#c5d0df;font-family:Amiri,serif;font-size:21px; }
    .rule { width:62px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 0 22px; }
    .message { max-width:310px;margin:0 0 34px;color:var(--muted);font-family:Amiri,serif;font-size:19px;line-height:1.9; }
    .enter {
      width:min(100%,270px);min-height:54px;display:grid;place-items:center;text-decoration:none;
      border-radius:15px;color:#101a2b;font-weight:800;font-size:16px;
      background:linear-gradient(135deg,#f0e4c8,#c8b17e);box-shadow:0 8px 24px rgba(0,0,0,.22);
      transition:transform .2s,filter .2s;border:0;cursor:pointer;font-family:inherit;
    }
    .enter:hover { transform:translateY(-2px);filter:brightness(1.05); }
    .skip { margin-top:17px;color:#9eacc0;text-decoration:none;font-size:13px;padding:7px 15px; }
    .skip:hover { color:var(--silver); }

    /* حركات ترحيبية هادئة */
    .welcome { animation: card-arrive .95s cubic-bezier(.2,.75,.25,1) both; }
    .logo-wrap { animation: logo-arrive 1.05s .12s cubic-bezier(.2,.8,.2,1) both, logo-glow 4.5s 1.3s ease-in-out infinite; }
    h1 { animation: text-arrive .8s .32s both; }
    .subtitle { animation: text-arrive .8s .48s both; }
    .rule { animation: line-grow .8s .62s both; }
    .message { animation: text-arrive .85s .72s both; }
    .enter { animation: text-arrive .8s .9s both, button-breathe 3.2s 1.8s ease-in-out infinite; }
    .skip { animation: text-arrive .8s 1.05s both; }
    .ambient { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0;
      background-image:radial-gradient(2px 2px at 12% 18%,rgba(235,242,255,.8) 45%,transparent 70%),
      radial-gradient(1.5px 1.5px at 82% 24%,rgba(220,228,239,.7) 45%,transparent 70%),
      radial-gradient(2px 2px at 22% 76%,rgba(214,183,122,.65) 45%,transparent 70%),
      radial-gradient(1.5px 1.5px at 88% 82%,rgba(235,242,255,.7) 45%,transparent 70%),
      radial-gradient(1px 1px at 52% 12%,rgba(235,242,255,.65) 45%,transparent 70%); 
      animation: star-drift 16s ease-in-out infinite alternate; }
    .welcome > :not(.ambient) { position:relative; z-index:1; }
    .enter { position:relative; overflow:hidden; }
    .enter:after { content:""; position:absolute; top:-60%; left:-65%; width:35%; height:220%;
      transform:rotate(22deg); background:rgba(255,255,255,.42); filter:blur(8px);
      animation: button-shine 5s 2.2s ease-in-out infinite; pointer-events:none; }
    @keyframes card-arrive { from {opacity:0;transform:translateY(22px) scale(.975)} to {opacity:1;transform:translateY(0) scale(1)} }
    @keyframes logo-arrive { from {opacity:0;transform:translateY(16px) scale(.78) rotate(-7deg)} to {opacity:1;transform:translateY(0) scale(1) rotate(0)} }
    @keyframes logo-glow { 0%,100% {box-shadow:0 12px 35px rgba(0,0,0,.3),0 0 22px rgba(220,228,239,.07)} 50% {box-shadow:0 12px 35px rgba(0,0,0,.3),0 0 34px rgba(220,228,239,.2)} }
    @keyframes text-arrive { from {opacity:0;transform:translateY(12px)} to {opacity:1;transform:translateY(0)} }
    @keyframes line-grow { from {opacity:0;transform:scaleX(.15)} to {opacity:1;transform:scaleX(1)} }
    @keyframes button-breathe { 0%,100% {box-shadow:0 8px 24px rgba(0,0,0,.22),0 0 0 rgba(220,228,239,0)} 50% {box-shadow:0 9px 27px rgba(0,0,0,.27),0 0 20px rgba(220,228,239,.17)} }
    @keyframes button-shine { 0%,72%,100% {left:-65%} 86% {left:135%} }
    @keyframes star-drift { from {transform:translate3d(-4px,0,0);opacity:.55} to {transform:translate3d(5px,-9px,0);opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; }
    }
    @media(max-height:620px) { .welcome{min-height:auto;padding:25px 20px}.logo-wrap{width:82px;height:82px;margin-bottom:14px}h1{font-size:32px}.subtitle{margin-bottom:12px}.rule{margin-bottom:12px}.message{margin-bottom:18px;font-size:17px} }
  </style>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const forceWelcome = params.get("welcome") === "1";
      try {
        if (!forceWelcome && localStorage.getItem("joebooks_welcome_seen") === "1") {
          location.replace("../index.html");
        }
      } catch (error) {
        // إذا منع المتصفح التخزين، تبقى شاشة الترحيب قابلة للاستخدام في كل زيارة.
      }
    })();
  </script>
</head>
<body>
  <main class="welcome">
    <div class="ambient" aria-hidden="true"></div>
    <div class="logo-wrap"><img src="../logo.jpg" alt="شعار مكتبة الأحلام"></div>
    <h1>مكتبة الأحلام</h1>
    <p class="subtitle">عالم من الحكايات</p>
    <span class="rule" aria-hidden="true"></span>
    <p class="message">كل كتاب حكاية، وكل حكاية عالم جديد.</p>
    <a class="enter" href="../index.html" id="enterLibrary">ابدأ رحلتك</a>
    <a class="skip" href="../index.html" id="skipWelcome">تخطي والدخول إلى المكتبة</a>
  </main>
  <script>
    function rememberWelcome() {
      try { localStorage.setItem("joebooks_welcome_seen", "1"); } catch (error) {}
    }
    document.getElementById("enterLibrary").addEventListener("click", rememberWelcome);
    document.getElementById("skipWelcome").addEventListener("click", rememberWelcome);
  </script>
</body>
</html>
