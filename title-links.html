<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1426"><title>روابط الكتب — مكتبة الأحلام</title>
<style>:root{color-scheme:dark;--navy:#0b1426;--silver:#dce4ef;--line:#344158;--muted:#aab7ca}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--silver);font-family:Tahoma,Arial,sans-serif;line-height:1.7}.wrap{max-width:1150px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 18px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#101c30;color:var(--silver);font-size:16px;margin:0 0 14px}.count{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:14px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;background:#101c30}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{background:#172640;position:sticky;top:0}a{color:#c2d7ff;text-decoration:underline}.status{color:var(--muted);padding:20px}@media(max-width:700px){.wrap{padding:12px}h1{font-size:21px}table{font-size:13px}th,td{padding:7px}}</style></head>
<body><main class="wrap"><h1>روابط الكتب — مكتبة الأحلام</h1><p class="sub">قائمة تضم 91 كتابًا وروابط منشوراتها في قناة مكتبة الأحلام.</p><div class="count">عدد الكتب: <strong id="count">91</strong></div><input id="search" class="search" type="search" placeholder="ابحث عن عنوان كتاب…" aria-label="ابحث عن عنوان كتاب"><div id="status" class="status">جارٍ تحميل القائمة…</div><div class="table-wrap"><table><thead><tr><th>#</th><th>عنوان الكتاب</th><th>المؤلف</th><th>الرابط</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
const selectedIds=new Set([1753,1755,1754,1750,1748,1747,1744,1743,1742,1740,1739,1737,1734,1735,1732,1730,1839,1727,1726,1724,1722,1719,1720,1718,1717,1711,1705,1704,1701,1699,1697,1696,1692,1691,1636,1688,1687,1685,1684,1680,1678,1677,1674,1672,1671,1669,1666,1665,1663,1662,1661,1659,1658,1657,1656,1653,1652,1649,1648,1646,1638,1634,1630,1628,1626,1625,1623,1622,1621,1619,1595,1616,1614,1611,1607,1605,1603,1598,1600,1602,1594,1591,1587,1585,1584,1583,1579,1580,1581,1577,1576]);
const rowsEl=document.getElementById('rows'),statusEl=document.getElementById('status'),searchEl=document.getElementById('search');
let books=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const q=searchEl.value.trim().toLocaleLowerCase();const shown=books.filter(b=>[b.title,b.author].join(' ').toLocaleLowerCase().includes(q));rowsEl.innerHTML=shown.map((b,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(b.title)+'</td><td>'+esc(b.author||'—')+'</td><td><a href="'+esc(b.url)+'" target="_blank" rel="noopener noreferrer">فتح الكتاب في تيليجرام ↗</a></td></tr>').join('');document.getElementById('count').textContent=shown.length;statusEl.hidden=true;}
searchEl.addEventListener('input',render);
fetch('./books.json').then(r=>{if(!r.ok)throw new Error('تعذر تحميل البيانات');return r.json();}).then(data=>{books=data.filter(b=>selectedIds.has(Number(b.id))&&b.url).sort((a,b)=>Number(b.id)-Number(a.id));render();}).catch(()=>{statusEl.textContent='تعذر تحميل القائمة. أعد تحميل الصفحة بعد قليل.';});
</script></body></html>
