<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة الأحلام | المكتبة الصوتية</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0b1426;
  color: #dce4ef;
  font-family: Tahoma, Arial, sans-serif;
}
header {
  padding: 25px 15px;
  text-align: center;
  background: #14233d;
  border-bottom: 1px solid #52637c;
}
header h1 { margin: 0 0 10px; }
header p { color: #aab8cc; }
main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 15px;
}
#search {
  width: 100%;
  padding: 15px;
  border: 1px solid #52637c;
  border-radius: 12px;
  background: #182944;
  color: white;
  font-size: 16px;
  margin-bottom: 25px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(210px,1fr));
  gap: 18px;
}
.card {
  background: #14233d;
  border: 1px solid #354967;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
}
.cover { font-size: 65px; margin: 15px 0; }
.card h3 { font-size: 16px; min-height: 45px; }
.card small { color: #aab8cc; }
button {
  border: 0;
  background: #dce4ef;
  color: #0b1426;
  padding: 12px 18px;
  border-radius: 10px;
  cursor: pointer;
}
.card button { margin-top: 15px; }
.player {
  display: none;
  position: fixed;
  inset: 0;
  background: #0b1426;
  z-index: 10;
  overflow-y: auto;
  padding: 30px 15px;
  text-align: center;
}
.player.active { display: block; }
.player-inner {
  max-width: 450px;
  margin: 30px auto;
  background: #14233d;
  padding: 25px;
  border-radius: 20px;
  border: 1px solid #52637c;
}
audio { width: 100%; margin: 20px 0; }
select { padding: 10px; border-radius: 10px; }
</style>
</head>
<body>
<header>
  <h1>🎧 مكتبة الأحلام الصوتية</h1>
  <p>استمع إلى الروايات والكتب الصوتية الكاملة</p>
</header>

<main>
  <input id="search" placeholder="ابحث عن رواية صوتية...">
  <div id="grid" class="grid"></div>
</main>

<div id="player" class="player">
  <button id="back">← العودة إلى المكتبة</button>
  <div class="player-inner">
    <div class="cover">📖</div>
    <h2 id="title"></h2>
    <p>رواية صوتية كاملة</p>
    <div id="youtubePlayer" style="display:none"></div><audio id="audio" controls preload="metadata"></audio>
    <p>سرعة التشغيل</p>
    <select id="speed">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
    <p id="status"></p>
  </div>
</div>

<script>
let books = [];
let currentBook = null;
const grid = document.getElementById("grid");
const audio = document.getElementById("audio");
const player = document.getElementById("player");
const title = document.getElementById("title");
const speed = document.getElementById("speed");
const status = document.getElementById("status");

function render(list) {
  grid.innerHTML = "";
  list.forEach(book => {
    const card = document.createElement("div");
    card.className = "card";

    const cover = document.createElement("div");
    cover.className = "cover";
    cover.textContent = "🎧";

    const name = document.createElement("h3");
    name.textContent = book.title;

    const size = document.createElement("small");
    size.textContent = book.size_mb + " MB";

    const btn = document.createElement("button");
    btn.textContent = "▶ استمع الآن";
    btn.onclick = () => openBook(book);

    card.append(cover, name, size, document.createElement("br"), btn);
    grid.appendChild(card);
  });
}

function openBook(book) {
  audio.pause();
  currentBook = book;
  title.textContent = book.title;
  status.textContent = "جاهز للاستماع";
  const yt = document.getElementById("youtubePlayer");
yt.innerHTML = "";
yt.style.display = "none";
audio.style.display = "block";

if (book.source === "youtube" && book.youtube_id) {
  audio.removeAttribute("src");
  audio.load();
  audio.style.display = "none";
  yt.style.display = "block";
  const frame = document.createElement("iframe");
  frame.src = "https://www.youtube-nocookie.com/embed/" +
              encodeURIComponent(book.youtube_id);
  frame.style.width = "100%";
  frame.style.aspectRatio = "16 / 9";
  frame.style.border = "0";
  frame.allow = "accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share";
  frame.allowFullscreen = true;
  yt.appendChild(frame);
} else {
  audio.src = book.audio_url;
}
  audio.load();
  speed.value = "1";
  audio.playbackRate = 1;
  player.classList.add("active");
}

document.getElementById("back").onclick = () => {
  audio.pause();
  document.getElementById("youtubePlayer").innerHTML = "";
player.classList.remove("active");
};

speed.onchange = () => {
  audio.playbackRate = Number(speed.value);
};

audio.addEventListener("loadedmetadata", () => {
  if (!currentBook) return;
  const key = "audio_position_" + currentBook.id;
  const saved = Number(localStorage.getItem(key));
  if (saved > 0 && saved < audio.duration - 5) {
    audio.currentTime = saved;
  }
});

audio.addEventListener("timeupdate", () => {
  if (currentBook) {
    localStorage.setItem(
      "audio_position_" + currentBook.id,
      String(audio.currentTime)
    );
  }
});

audio.addEventListener("ended", () => {
  if (currentBook) {
    localStorage.removeItem("audio_position_" + currentBook.id);
  }
});

audio.addEventListener("error", () => {
  status.textContent = "تعذر تشغيل الملف الصوتي";
});

document.getElementById("search").oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  render(books.filter(b => b.title.toLowerCase().includes(q)));
};

fetch("audiobooks.json")
  .then(r => {
    if (!r.ok) throw new Error("تعذر قراءة البيانات");
    return r.json();
  })
  .then(data => {
    books = data;
    render(books);
  })
  .catch(() => {
    grid.textContent = "تعذر تحميل قائمة الروايات";
  });
</script>
</body>
</html>
