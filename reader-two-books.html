<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1426">
  <title>قارئ الروايات | مكتبة الأحلام</title>
  <style>
    :root{color-scheme:dark;--navy:#0b1426;--panel:#111f35;--silver:#dce4ef;--muted:#9eacc0;--gold:#d6b66b}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:radial-gradient(ellipse at top,#172945 0,var(--navy) 58%);color:var(--silver);font-family:Tahoma,Arial,sans-serif}
    body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    header{display:none}
    .brand,h1,.sub{display:none}
    main{width:100%;height:100%;margin:0;display:flex;flex-direction:column;flex:1 1 0;min-height:0;max-height:none}
    .toolbar{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;justify-content:space-between;background:#0b1426;border:0;border-bottom:1px solid #ffffff18;border-radius:0;padding:5px 7px;margin:0;flex:none}
    .choices{display:flex;gap:8px;flex:1;min-width:0}
    .choices button{display:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;color:#ffe5a4;font-weight:700;padding:8px 6px;cursor:default}
    .choices button[aria-pressed=true]{display:block}
    .reader-actions{display:flex;gap:6px;align-items:center;flex:none}
    .reader-actions button{padding:8px 10px;font-size:12px;white-space:nowrap}
    #back-button{border-color:#ffffff30;background:#1a2a43}
    #close-button{border-color:#8c5555;background:#38232a;color:#ffe0dc}
    button,a{font:inherit}
    button{border:1px solid #ffffff26;border-radius:10px;padding:10px 13px;background:#1a2a43;color:var(--silver);cursor:pointer}
    button[aria-pressed=true]{border-color:var(--gold);background:#3a3325;color:#ffe5a4}
    button:disabled{opacity:.5;cursor:wait}
    .open{color:var(--gold);text-decoration:none;font-size:13px;padding:8px}
    .reader{overflow:hidden;border:0;border-radius:0;background:#18243a;box-shadow:none;flex:1 1 0;min-height:0;display:flex;flex-direction:column}
    #pdf-viewer{display:block;width:100%;height:100%;min-height:0;flex:1 1 0;background:#18243a}
    #pdf-viewer iframe,#pdf-viewer>div{max-width:100%}
    #pdf-viewer embedpdf-container{display:block;width:100%;height:100%;min-height:0}
    #status{padding:16px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
    #status.error{color:#ffd0c8}
    #fullscreen-toggle{display:none!important}
    .notice{display:none!important}
    body.is-fullscreen{background:#000}
    body.is-fullscreen header,body.is-fullscreen .toolbar,body.is-fullscreen .notice{display:none!important}
    body.is-fullscreen main{width:100%;height:100%;max-height:none;margin:0;flex:1;min-height:0}
    body.is-fullscreen .reader{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
    body.is-fullscreen #pdf-viewer{width:100%;height:100%;min-height:0}
    body.is-fullscreen #fullscreen-toggle{position:fixed;z-index:99999;top:calc(env(safe-area-inset-top) + 10px);left:10px;display:block;background:#0b1426eF;box-shadow:0 2px 12px #0008}
    .notice{text-align:center;color:var(--muted);font-size:12px;line-height:1.8;margin:6px 4px 0;flex:none}
    @media(max-width:600px){
      main{width:100%;height:100%;margin:0;max-height:none;flex:1 1 0;min-height:0}
      .toolbar{align-items:center;gap:5px;padding:5px}
      .choices{display:flex;flex:1;min-width:0}
      .choices button{min-width:0;padding:8px 4px;font-size:12px;text-align:right}
      .reader-actions{gap:4px}
      .reader-actions button{padding:8px 7px;font-size:11px}
      .reader{min-height:0}
      #pdf-viewer,#pdf-viewer embedpdf-container{min-height:0}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">مكتبة الأحلام</div>
    <h1>مساحتك الخاصة بين الكتب</h1>
    <p class="sub">قارئ الروايات</p>
  </header>
  <main>
    <section class="toolbar" aria-label="أدوات القارئ">
      <div class="choices" aria-label="الرواية المفتوحة">
        <button type="button" data-book="narcissi" data-src="https://joebooks-pdf-gateway.jo-dz-jd.workers.dev/test/narcissi" aria-pressed="true">نرجسي في حياتي</button>
        <button type="button" data-book="never-split" data-src="https://joebooks-pdf-gateway.jo-dz-jd.workers.dev/test/never-split" aria-pressed="false">لا تقسم الفرق أبداً</button>
      </div>
      <div class="reader-actions"><button type="button" id="back-button">↩ العودة</button><button type="button" id="close-button">✕ إغلاق</button></div>
    </section>
    <section class="reader" aria-label="قارئ صفحات الرواية">
      <div id="status" role="status" aria-live="polite">جارٍ تجهيز قارئ الروايات…</div>
      <div id="pdf-viewer" aria-label="عارض ملف PDF"></div>
    </section>
    <p class="notice">يمكنك التنقل بين الصفحات والتكبير والتصغير باستخدام أدوات العارض.</p>
  </main>

  <script type="module">
    const status = document.getElementById("status");
    const viewerTarget = document.getElementById("pdf-viewer");
    const backButton = document.getElementById("back-button");
    const closeButton = document.getElementById("close-button");
    const buttons = [...document.querySelectorAll("[data-src]")];
    const fullscreenButton = document.getElementById("fullscreen-toggle");
    const webApp = window.Telegram?.WebApp;

    function syncFullscreenState(active) {
      document.body.classList.toggle("is-fullscreen", active);
      fullscreenButton.setAttribute("aria-pressed", String(active));
      fullscreenButton.textContent = active ? "✕ خروج من ملء الشاشة" : "⛶ ملء الشاشة";
    }

    async function toggleFullscreen() {
      try {
        if (document.body.classList.contains("is-fullscreen")) {
          if (webApp?.isVersionAtLeast?.("8.0") && webApp.isFullscreen) {
            webApp.exitFullscreen();
          } else if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            syncFullscreenState(false);
          }
          return;
        }

        if (webApp) {
          if (webApp.isVersionAtLeast?.("8.0") && typeof webApp.requestFullscreen === "function") {
            webApp.requestFullscreen();
          } else {
            webApp.expand?.();
            syncFullscreenState(true);
          }
        } else if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        } else {
          syncFullscreenState(true);
        }
      } catch (error) {
        console.error("Fullscreen request failed:", error);
        showStatus("تعذر تفعيل ملء الشاشة على هذا الإصدار. حدّث Telegram ثم حاول مجدداً.", true);
      }
    }

    fullscreenButton.addEventListener("click", toggleFullscreen);

    backButton.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else if (webApp && typeof webApp.close === "function") {
        webApp.close();
      } else {
        window.location.href = "./";
      }
    });

    closeButton.addEventListener("click", () => {
      if (webApp && typeof webApp.close === "function") {
        webApp.close();
      } else if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "./";
      }
    });
    if (webApp) {
      webApp.ready?.();
      webApp.expand?.();
      webApp.onEvent?.("fullscreenChanged", () => syncFullscreenState(!!webApp.isFullscreen));
      webApp.onEvent?.("fullscreenFailed", () => {
        syncFullscreenState(false);
        showStatus("لم يسمح Telegram بملء الشاشة. جرّب تحديث التطبيق.", true);
      });
      if (webApp.isFullscreen) syncFullscreenState(true);
    }
    document.addEventListener("fullscreenchange", () => syncFullscreenState(!!document.fullscreenElement));
    let EmbedPDF = null;
    let loadSequence = 0;

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
      status.style.display = "block";
    }

    async function loadBook(button) {
      const sequence = ++loadSequence;
      const src = button.dataset.src;
      const activeBook = button.dataset.book;

      buttons.forEach(item => {
        item.setAttribute("aria-pressed", String(item === button));
        item.disabled = true;
      });
      const url = new URL(location.href);
      url.searchParams.set("book", activeBook);
      history.replaceState(null, "", url);

      showStatus("جارٍ تحميل الرواية بمحرك PDFium…");
      viewerTarget.innerHTML = "";

      try {
        if (!EmbedPDF) {
          const module = await import("https://cdn.jsdelivr.net/npm/@embedpdf/snippet@2/dist/embedpdf.js");
          EmbedPDF = module.default;
          var ZoomMode = module.ZoomMode;
        }
        if (sequence !== loadSequence) return;

        EmbedPDF.init({
          type: "container",
          target: viewerTarget,
          src,
          zoom: {
            defaultZoomLevel: ZoomMode.FitWidth,
            minZoom: 0.5,
            maxZoom: 4
          }
        });

        showStatus("جارٍ فتح الرواية… ستختفي هذه الرسالة عند ظهور العارض.");
        const startedAt = Date.now();
        const checkViewer = () => {
          if (sequence !== loadSequence) return;
          const mounted = viewerTarget.childElementCount > 0;
          if (mounted) {
            status.style.display = "none";
            buttons.forEach(item => item.disabled = false);
          } else if (Date.now() - startedAt > 25000) {
            showStatus("تأخر تشغيل العارض. تحقق من الاتصال ثم أعد اختيار الرواية.", true);
            buttons.forEach(item => item.disabled = false);
          } else {
            window.setTimeout(checkViewer, 500);
          }
        };
        window.setTimeout(checkViewer, 500);
      } catch (error) {
        console.error("PDFium reader error:", error);
        if (sequence === loadSequence) {
          showStatus("تعذر تشغيل قارئ PDFium: " + (error?.message || "خطأ غير معروف") + " — يمكنك فتح الملف من الرابط أعلاه.", true);
          buttons.forEach(item => item.disabled = false);
        }
      }
    }

    buttons.forEach(button => button.addEventListener("click", () => loadBook(button)));
    const requestedBook = new URLSearchParams(location.search).get("book");
    const initialButton = buttons.find(button => button.dataset.book === requestedBook) || buttons[0];
    loadBook(initialButton);
  </script>
</body>
</html>
