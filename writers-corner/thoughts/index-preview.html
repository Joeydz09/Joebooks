<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خواطر | مكتبة الأحلام</title>
<style>
body {background:#0b1426;color:#f5f5f5;font-family:Tahoma,Arial,sans-serif;margin:0;padding:25px}
main {max-width:850px;margin:50px auto}
a {color:#dce4ef}
.card {background:#14223a;border:1px solid #34445b;border-radius:16px;padding:25px;margin-top:25px}
</style>
</head>
<body>
<main>
<a href="../../index.html#writers-corner">العودة إلى ركن المبدعين</a>
<h1>خواطر</h1>
<div class="card">
<h2>مرحبا بك</h2>
<p>ستظهر هنا الأعمال الأدبية التي تتم الموافقة على نشرها.</p>
</div>
</main>
<script>
(async function () {
  const container = document.querySelector(".card");
  if (!container) return;

  container.textContent = "جارٍ تحميل الخواطر...";

  try {
    const response = await fetch(
      "https://sotwboiyyilelmesvoyo.supabase.co/functions/v1/get-approved-writings?category=thoughts"
    );

    if (!response.ok) throw new Error("HTTP " + response.status);

    const result = await response.json();
    const writings = result.writings || [];

    container.replaceChildren();

    if (!writings.length) {
      container.textContent = "لا توجد خواطر منشورة حاليًا.";
      return;
    }

    for (const writing of writings) {
      const article = document.createElement("article");

      const title = document.createElement("h2");
      title.textContent = writing.title;

      const author = document.createElement("p");
      author.textContent = "بقلم: " + writing.author;

      const content = document.createElement("p");
      content.textContent = writing.content;
      content.style.whiteSpace = "pre-wrap";

      article.append(title, author, content);

const likeButton = document.createElement("button");
likeButton.type = "button";
likeButton.textContent = "♡ إعجاب";

likeButton.style.cssText =
  "margin-top:15px;padding:10px 18px;border-radius:12px;" +
  "background:#243957;color:white;border:1px solid #526783;" +
  "cursor:pointer;font-size:15px;";

likeButton.addEventListener("click", async () => {
  const tg = window.Telegram?.WebApp;
  let initData = tg?.initData || "";

  if (!initData) {
    try {
      initData = sessionStorage.getItem("maktabat_telegram_init_data") || "";
    } catch {}
  }

  if (!initData) {
    alert("افتح مكتبة الأحلام من داخل تيليجرام للإعجاب.");
    return;
  }

  likeButton.disabled = true;
  likeButton.textContent = "جارٍ تسجيل الإعجاب...";

  try {
    const response = await fetch(
      "https://sotwboiyyilelmesvoyo.supabase.co/functions/v1/writing-like",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          submission_id: writing.id,
          action: "like",
          initData: initData
        })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Like failed");
    }

    likeButton.textContent = "❤️ أعجبني (" + result.likes + ")";
  } catch (error) {
    likeButton.textContent = "♡ إعجاب";
    alert("تعذر تسجيل الإعجاب. حاول مجددًا.");
    console.error(error);
  } finally {
    likeButton.disabled = false;
  }
});

article.appendChild(likeButton);

      article.style.marginBottom = "24px";
      container.appendChild(article);
    }
  } catch (error) {
    container.textContent = "تعذر تحميل الخواطر.";
    console.error(error);
  }
})();
</script>
</body>
</html>
