<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شارك إبداعك | مكتبة الأحلام</title>
<style>
* { box-sizing: border-box; }
body {
  background: #0b1426;
  color: #f5f5f5;
  font-family: Tahoma, Arial, sans-serif;
  margin: 0;
  padding: 20px;
}
main { max-width: 700px; margin: 35px auto; }
h1 { color: #dce4ef; text-align: center; }
p { line-height: 1.8; text-align: center; }
form {
  background: #14223a;
  border: 1px solid #34445b;
  border-radius: 18px;
  padding: 25px;
}
label { display: block; margin: 16px 0 8px; }
input, select, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #506078;
  border-radius: 10px;
  background: #0b1426;
  color: white;
  font: inherit;
}
textarea { min-height: 220px; resize: vertical; }
button {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  background: #dce4ef;
  color: #0b1426;
  border: 0;
  border-radius: 12px;
  font-weight: bold;
  font: inherit;
}
button:disabled { opacity: .6; }
a { color: #dce4ef; }
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main>
<a href="../../index.html#writers-corner">← العودة إلى ركن المبدعين</a>
<h1>✍️ شارك إبداعك</h1>
<p>مساحة لنشر إبداعاتكم الأدبية بعد مراجعتها.</p>

<form id="submissionForm">
<label for="author">اسم الكاتب</label>
<input id="author" maxlength="100" required>

<label for="title">عنوان العمل</label>
<input id="title" maxlength="200" required>

<label for="category">نوع الإبداع</label>
<select id="category" required>
<option value="">اختر النوع</option>
<option value="thoughts">خاطرة</option>
<option value="stories">قصة قصيرة</option>
<option value="poems">قصيدة</option>
</select>

<label for="content">نص الإبداع</label>
<textarea id="content" maxlength="15000" required></textarea>

<button type="submit" disabled>إرسال المشاركة</button>
<p id="message" role="status">
سنفعّل الإرسال بعد ربط الاستمارة بخدمة Cloudflare.
</p>
</form>
</main>
<script>
const form = document.getElementById("submissionForm");
const button = form.querySelector('button[type="submit"]');
const message = document.getElementById("message");
const telegram = window.Telegram?.WebApp;
let initData = telegram?.initData || "";

console.log("TELEGRAM_DATA_SOURCE", {
  direct: Boolean(telegram?.initData)
});

if (!initData) {
  try {
    initData = sessionStorage.getItem("maktabat_telegram_init_data") || "";
    console.log("TELEGRAM_STORAGE_USED", Boolean(initData));
  } catch (error) {
    console.warn("Telegram session storage unavailable");
  }
}
if (telegram) telegram.ready();

if (initData) {
  button.disabled = false;
  button.textContent = "إرسال المشاركة";
  message.textContent = "ستُراجع مشاركتك قبل نشرها.";
} else {
  message.textContent = "لإرسال مشاركتك، افتح الاستمارة من تطبيق مكتبة الأحلام داخل تيليجرام.";
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!initData || button.disabled) return;

  button.disabled = true;
  button.textContent = "جارٍ الإرسال...";
  message.textContent = "";

  try {
    const response = await fetch(
      "https://maktabat-writers.jo-dz-jd.workers.dev/api/submit",
      {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          initData: initData,
          author: document.getElementById("author").value.trim(),
          title: document.getElementById("title").value.trim(),
          category: document.getElementById("category").value,
          content: document.getElementById("content").value.trim()
        })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "تعذر إرسال المشاركة");
    }

    message.textContent = result.message || "تم استلام مشاركتك.";
    form.reset();
  } catch (error) {
    message.textContent = error.message || "حدث خطأ أثناء الإرسال.";
  } finally {
    button.disabled = false;
    button.textContent = "إرسال المشاركة";
  }
});
</script>
</body>
</html>
