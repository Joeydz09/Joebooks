<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قصائد | مكتبة الأحلام</title>
<style>
body {background:#0b1426;color:#f5f5f5;font-family:Tahoma,Arial,sans-serif;margin:0;padding:25px}
main {max-width:850px;margin:50px auto}
a {color:#dce4ef}
.card {background:#14223a;border:1px solid #34445b;border-radius:16px;padding:25px;margin-top:25px}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main>
<a href="../../index.html#writers-corner">العودة إلى ركن المبدعين</a>
<h1>قصائد</h1>
<div class="card">
<h2>مرحبا بك</h2>
<p>ستظهر هنا الأعمال الأدبية التي تتم الموافقة على نشرها.</p>
</div>
</main>

<script>
(async () => {
  const container = document.querySelector(".card");
  const base = "https://sotwboiyyilelmesvoyo.supabase.co/functions/v1/";
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  let initData = tg?.initData || "";
  if (!initData) {
    try { initData = sessionStorage.getItem("maktabat_telegram_init_data") || ""; }
    catch (_) {}
  }
  container.replaceChildren();
  const notice = document.createElement("p");
  notice.textContent = "جارٍ تحميل الخواطر...";
  container.append(notice);

  async function postLike(id, action) {
    const response = await fetch(base + "writing-like", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({submission_id:id, action, initData})
    });
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.error || "Request failed");
    return data;
  }
  try {
    const response = await fetch(base + "get-approved-writings?category=poems");
    if (!response.ok) throw new Error("Loading failed");
    const data = await response.json();
    container.replaceChildren();
    if (!data.writings?.length) {
      notice.textContent = "لا توجد خواطر منشورة حاليًا.";
      container.append(notice);
      return;
    }
    for (const writing of data.writings) {
      const article = document.createElement("article");
      article.style.cssText = "margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid #34445b";
      const title = document.createElement("h2"); title.textContent = writing.title;
      const author = document.createElement("p"); author.textContent = "بقلم: " + writing.author;
      const content = document.createElement("p");
      content.textContent = writing.content;
      content.style.whiteSpace = "pre-wrap";
      const button = document.createElement("button");
      button.type = "button";
      button.style.cssText = "margin-top:15px;padding:10px 18px;border-radius:12px;background:#243957;color:white;border:1px solid #526783;cursor:pointer;font-size:15px";
      let liked = false, likes = 0;
      const render = () => { button.textContent = (liked ? "❤️ أعجبني" : "♡ إعجاب") + " (" + likes + ")"; };
      button.textContent = "جارٍ تحميل الإعجابات...";
      button.disabled = true;
      /* ADMIN_DELETE_MENU_V1 */
const adminMenu = document.createElement("button");
adminMenu.type = "button";
adminMenu.textContent = "⋮";
adminMenu.title = "خيارات المنشور";
adminMenu.hidden = true;
adminMenu.style.cssText = "float:left;margin-right:12px;background:transparent;color:#dce4ef;border:1px solid #526783;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:22px";

try {
  const params = new URLSearchParams(initData);
  const user = JSON.parse(params.get("user") || "{}");
  adminMenu.hidden = String(user.id) !== "298579608";
} catch (_) {}

adminMenu.onclick = async () => {
  if (!initData) return;

  if (!confirm("هل تريد حذف هذا المنشور نهائيًا؟")) return;

  adminMenu.disabled = true;

  try {
    const response = await fetch(base + "delete-writing", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        submission_id: Number(writing.id),
        category: "poems",
        initData
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "فشل الحذف");
    }

    article.remove();
    alert("تم حذف المنشور بنجاح.");
  } catch (error) {
    alert("تعذر الحذف: " + error.message);
  } finally {
    adminMenu.disabled = false;
  }
};

article.append(adminMenu, title, author, content, button);
      container.append(article);
      try {
        const countResponse = await fetch(base + "writing-like?submission_id=" + encodeURIComponent(writing.id));
        if (countResponse.ok) {
          const countData = await countResponse.json();
          likes = Number(countData.likes) || 0;
        }
        if (initData) {
          const state = await postLike(writing.id, "status");
          liked = Boolean(state.liked);
          likes = Number(state.likes) || 0;
        }
      } catch (error) { console.warn("تعذر جلب حالة الإعجاب", error); }
      button.disabled = false;
      render();

      // Comments section
      const commentsBox = document.createElement("section");
      commentsBox.style.cssText =
        "margin-top:18px;padding:14px;border:1px solid #34445b;border-radius:12px";

      const commentsTitle = document.createElement("h3");
      commentsTitle.textContent = "\uD83D\uDCAC \u0627\u0644\u062A\u0639\u0644\u064A\u0642\u0627\u062A";

      const commentsList = document.createElement("div");
      commentsList.textContent = "\u062C\u0627\u0631\u064D \u062A\u062D\u0645\u064A\u0644 \u0627\u0644\u062A\u0639\u0644\u064A\u0642\u0627\u062A...";

      const commentInput = document.createElement("textarea");
      commentInput.placeholder = "\u0627\u0643\u062A\u0628 \u062A\u0639\u0644\u064A\u0642\u0643 \u0647\u0646\u0627...";
      commentInput.maxLength = 1000;
      commentInput.rows = 3;
      commentInput.style.cssText =
        "width:100%;box-sizing:border-box;margin-top:12px;padding:10px;border-radius:8px;background:#142238;color:white;border:1px solid #526783";

      const sendButton = document.createElement("button");
      sendButton.type = "button";
      sendButton.textContent = "\u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u062A\u0639\u0644\u064A\u0642";
      sendButton.style.cssText =
        "margin-top:8px;padding:10px 18px;border-radius:9px;background:#29476a;color:white;border:1px solid #526783;cursor:pointer";

      const commentMessage = document.createElement("p");
      commentMessage.setAttribute("aria-live", "polite");

      commentsBox.append(
        commentsTitle, commentsList, commentInput,
        sendButton, commentMessage
      );
      article.append(commentsBox);

      async function loadComments() {
        try {
          const response = await fetch(
            base + "writing-comment?submission_id=" +
            encodeURIComponent(writing.id)
          );
          if (!response.ok) throw new Error("Load failed");

          const result = await response.json();
          commentsList.replaceChildren();

          const comments = result.comments || [];
          commentsTitle.textContent =
            "\uD83D\uDCAC \u0627\u0644\u062A\u0639\u0644\u064A\u0642\u0627\u062A (" + comments.length + ")";

          if (!comments.length) {
            commentsList.textContent = "\u0644\u0627 \u062A\u0648\u062C\u062F \u062A\u0639\u0644\u064A\u0642\u0627\u062A \u0628\u0639\u062F.";
          }

          for (const comment of comments) {
            const item = document.createElement("div");
            item.style.cssText =
              "padding:10px 0;border-bottom:1px solid #34445b";

            const name = document.createElement("strong");
            name.textContent = comment.author_name;

            const message = document.createElement("p");
            message.textContent = comment.content;
            message.style.whiteSpace = "pre-wrap";

            item.append(name, message);
            commentsList.append(item);
          }
        } catch (error) {
          commentsList.textContent = "\u062A\u0639\u0630\u0631 \u062A\u062D\u0645\u064A\u0644 \u0627\u0644\u062A\u0639\u0644\u064A\u0642\u0627\u062A.";
          console.error(error);
        }
      }

      sendButton.addEventListener("click", async () => {
        const content = commentInput.value.trim();

        if (!initData) {
          alert("\u0627\u0641\u062A\u062D \u0645\u0643\u062A\u0628\u0629 \u0627\u0644\u0623\u062D\u0644\u0627\u0645 \u0645\u0646 \u062A\u064A\u0644\u064A\u062C\u0631\u0627\u0645 \u0644\u0644\u062A\u0639\u0644\u064A\u0642.");
          return;
        }

        if (!content || content.length > 1000) {
          commentMessage.textContent = "\u0627\u0643\u062A\u0628 \u062A\u0639\u0644\u064A\u0642\u064B\u0627 \u0635\u0627\u0644\u062D\u064B\u0627.";
          return;
        }

        sendButton.disabled = true;
        commentMessage.textContent = "\u062C\u0627\u0631\u064D \u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u062A\u0639\u0644\u064A\u0642...";

        try {
          const response = await fetch(base + "writing-comment", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              submission_id: writing.id,
              content,
              initData
            })
          });

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.error || "Send failed");
          }

          commentInput.value = "";
          commentMessage.textContent = "\u062A\u0645 \u0646\u0634\u0631 \u062A\u0639\u0644\u064A\u0642\u0643 \u0628\u0646\u062C\u0627\u062D.";
          await loadComments();

        } catch (error) {
          commentMessage.textContent = "\u062A\u0639\u0630\u0631 \u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u062A\u0639\u0644\u064A\u0642.";
          console.error(error);
        } finally {
          sendButton.disabled = false;
        }
      });

      loadComments();

      button.addEventListener("click", async () => {
        if (!initData) {
          alert("افتح مكتبة الأحلام من التطبيق المصغر داخل تيليجرام للإعجاب.");
          return;
        }
        button.disabled = true;
        try {
          const result = await postLike(writing.id, liked ? "unlike" : "like");
          liked = Boolean(result.liked);
          likes = Number(result.likes) || 0;
          render();
        } catch (error) {
          alert("تعذر تحديث الإعجاب. حاول مجددًا.");
          console.error(error);
        } finally { button.disabled = false; }
      });
    }
  } catch (error) {
    notice.textContent = "تعذر تحميل الخواطر. حاول مجددًا لاحقًا.";
    container.replaceChildren(notice);
  }
})();
</script>
</body>
</html>
