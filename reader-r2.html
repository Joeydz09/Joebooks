<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1426">
<title>قارئ PDF | مكتبة الأحلام</title>
<style>
:root{color-scheme:dark;--navy:#0b1426;--silver:#dce4ef;--muted:#9eacc0;--gold:#d6b66b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--navy);color:var(--silver);font-family:Tahoma,Arial,sans-serif}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px;background:#0b1426;border-bottom:1px solid #ffffff20;flex:none}
.toolbar strong{font-size:13px;color:#ffe5a4}
.actions{display:flex;gap:6px;align-items:center}
button,.download{font:inherit;font-size:12px;border:1px solid #ffffff30;border-radius:9px;padding:8px 10px;background:#1a2a43;color:var(--silver);text-decoration:none;white-space:nowrap}
.download{color:#ffe5a4;border-color:#d6b66b}
main{flex:1;min-height:0;display:flex;flex-direction:column;background:#18243a}
#status{padding:16px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
#status.error{color:#ffd0c8}
#pdf-viewer{width:100%;height:100%;min-height:0;flex:1;background:#18243a;overflow:hidden}
</style>
</head>
<body>
<nav class="toolbar"><strong>مكتبة الأحلام · قارئ PDF</strong><div class="actions"><a id="download" class="download" href="#" target="_blank" rel="noopener noreferrer">⬇ تحميل</a><button id="back" type="button">↩ العودة</button></div></nav>
<main><div id="status" role="status" aria-live="polite">جارٍ تجهيز القارئ…</div><div id="pdf-viewer" aria-label="عارض ملف PDF"></div></main>
<script type="module">
const status=document.getElementById("status");
const viewer=document.getElementById("pdf-viewer");
const params=new URLSearchParams(location.search);
let pdfUrl;
try{
  pdfUrl=new URL(params.get("pdf")||"");
  if(pdfUrl.protocol!=="https:"||pdfUrl.hostname!=="joebooks-pdf-gateway.jo-dz-jd.workers.dev"||!pdfUrl.pathname.startsWith("/books/")||!pdfUrl.pathname.toLowerCase().endsWith(".pdf"))throw new Error("رابط PDF غير صالح");
}catch(e){
  status.textContent="رابط الكتاب غير صالح أو غير متاح.";
  status.classList.add("error");
  throw e;
}
document.getElementById("download").href=pdfUrl.href;
document.getElementById("back").addEventListener("click",()=>{if(history.length>1)history.back();else location.href="./";});
const webApp=window.Telegram?.WebApp;
webApp?.ready?.();webApp?.expand?.();
try{
  status.textContent="جارٍ تحميل ملف PDF داخل القارئ…";
  const module=await import("https://cdn.jsdelivr.net/npm/@embedpdf/snippet@2/dist/embedpdf.js");
  const EmbedPDF=module.default;
  const ZoomMode=module.ZoomMode;
  if(!EmbedPDF||typeof EmbedPDF.init!=="function")throw new Error("تعذر تحميل محرك PDF");
  const options={type:"container",target:viewer,src:pdfUrl.href};
  if(ZoomMode?.FitWidth!==undefined)options.zoom={defaultZoomLevel:ZoomMode.FitWidth,minZoom:0.5,maxZoom:4};
  EmbedPDF.init(options);
  const started=Date.now();
  const check=()=>{if(viewer.childElementCount>0){status.style.display="none";return;}if(Date.now()-started>30000){status.textContent="تعذر تحميل الكتاب داخل القارئ. يمكنك استخدام زر التحميل بالأعلى.";status.classList.add("error");return;}setTimeout(check,500);};
  setTimeout(check,500);
}catch(e){
  console.error("PDF reader error:",e);
  status.textContent="تعذر تشغيل القارئ. يمكنك استخدام زر التحميل بالأعلى.";
  status.classList.add("error");
}
</script>
</body>
</html>
